appId: io.github.marcocarvin.ahv-remote-console
# productName is the human-facing application name. It drives the macOS
# bundle name (→ "AHV Remote Console.app"), the Windows Start-Menu /
# Add-Remove-Programs entry, and the Linux .desktop Name. We deliberately
# do NOT set `executableName`: in electron-builder, executableName (when
# present) overrides appInfo.productFilename, which is what previously
# made the macOS bundle ship as the dashed, lowercase "ahv-remote-console.app".
# Letting it fall back to the sanitized productName gives the correct
# spaced display name on every platform. Download/installer filenames
# stay dashed-lowercase via `artifactName` below.
productName: AHV Remote Console
artifactName: ahv-remote-console-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 The AHV Remote Console Authors

# Do NOT recompile native node modules at package time. Our only native addon
# (@ahv-remote-console/native-keyhook) is Node-API (ABI-stable across Node and
# Electron), shipped as a prebuilt .node, so no rebuild is needed — and a rebuild
# would require a C/C++ toolchain on every package runner (impossible on the
# prod-wine Windows runner, which has no MSVC). Leaving this true would make
# electron-builder run node-gyp against the addon's binding.gyp and fail there.
npmRebuild: false
directories:
  output: release
  buildResources: ../../build

# Post-pack hardening:
#   - strips com.apple.quarantine xattr from the .app bundle (saves
#     1.8–3.4s on first launch by skipping XProtect's first-run scan)
#   - chmod +x and codesign --verify the Go runtime binary inside Resources
afterPack: ./scripts/after-pack.js
# macOS notarization + ticket stapling (VEN-02). No-op unless the App Store
# Connect API creds (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER) are in
# the environment, so credential-less builds are unaffected. A stapled notarized
# build launches instantly (offline Gatekeeper check) instead of stalling on the
# online notary round-trip under VPN. See scripts/notarize.js.
afterSign: ./scripts/notarize.js

# What goes inside the asar.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'

extraResources:
  - from: ../../build/runtime/${os}-${arch}/
    to: runtime/${os}-${arch}/
    filter:
      - ahv-remote-console-runtime*
  # (No plugin shared objects shipped: the AHV plugin is STATICALLY linked into
  # the runtime binary — apps/runtime/internal/plugins/registration.go blank-
  # imports plugins/ahv so its init() self-registers. There is no .so/.dylib/
  # .dll plugin to copy; the old extraResources/CI copy steps were dead.)
  # Bridge installer ISO. Packaged builds resolve it via
  # process.resourcesPath/agent.iso (see main/runtime-manager.ts
  # agentIsoPath()). CI must run `make iso` BEFORE electron-builder
  # so this file exists on disk.
  - from: ../../build/agent.iso
    to: agent.iso
  # Third-party license notices (generated by scripts/gen-third-party-notices.mjs;
  # required by the notice terms of bundled dependencies). Included in the app bundle.
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # PNG icons consumed by the running app (dock icon, BrowserWindow
  # icon, tray template). The installer-side icons configured by
  # `mac.icon` / `win.icon` / `linux.icon` are baked into the
  # .app/.exe by electron-builder itself — these are separate, runtime-
  # loaded assets that main.ts resolves via process.resourcesPath/icons/.
  - from: ../../build/icons/
    to: icons/

asar: true
asarUnpack:
  - resources/runtime/**
  # The native keyboard-grab addon (@ahv-remote-console/native-keyhook). A .node
  # cannot be dlopen'd from inside an asar, so extract it to app.asar.unpacked;
  # Electron transparently redirects the require() there. Absent on a build with
  # no prebuilt binary — the app then falls back to Send-Keys.
  - '**/*.node'

protocols:
  - name: AHV Remote Console OIDC
    schemes:
      - ahv-remote-console

# No update feed is baked into the installer. In-app auto-update is opt-in and
# reads its generic feed URL from AHV_REMOTE_CONSOLE_UPDATE_URL at runtime
# (see src/main/autoUpdate.ts).

# ----------------- Windows -----------------
# MSI dropped: WiX 4's candle.exe under wine on Linux x86_64 exits 255
# (.NET 4 isn't reliably emulated, see GitLab CI logs). NSIS already
# covers Windows distribution for both x64 and ia32, supports allowed-
# elevation install + per-user + machine-wide modes, and is what we
# ship as the primary installer. If MSI becomes a
# customer ask later (enterprise software-deployment requirement),
# the path forward is either a real Windows builder runner or pinning
# WiX 3 (electron-builder's MSI target supports both via msi.target).
win:
  target:
    - target: nsis
      arch: [x64, ia32]
  signAndEditExecutable: true
  icon: ../../build/icons/ahv-remote-console.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - en_US
    - it_IT
  deleteAppDataOnUninstall: false
  uninstallDisplayName: AHV Remote Console

msi:
  upgradeCode: a3a5e4ce-7e92-4b21-9b1f-2b8c1d0e9b21
  warningsAsErrors: false
  oneClick: false
  perMachine: false

# ----------------- Linux -----------------
# RPM target removed: fpm passes the productName ("AHV Remote Console")
# to rpmbuild as the .spec file path. rpmbuild has historically not
# coped with spaces in spec paths (quoting in the wrapper script breaks
# on argument splitting). AppImage + deb cover essentially every
# Linux-side operator; RHEL/Fedora users can repack from the deb or use
# AppImage directly. Re-enable RPM only when electron-builder ships an
# `executableName`-based spec path fix or we rename productName.
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: AHV Remote Console maintainers <maintainers@example.invalid>
  category: Network
  icon: ../../build/icons/
  desktop:
    entry:
      StartupNotify: 'true'
      Comment: Secure enterprise remote console for Nutanix AHV
      MimeType: x-scheme-handler/ahv-remote-console

deb:
  packageCategory: net
  priority: optional
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils

rpm:
  packageCategory: Applications/Internet

# ----------------- macOS (developer signing) -----------------
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: ../../build/entitlements.mac.plist
  entitlementsInherit: ../../build/entitlements.mac.plist
  icon: ../../build/icons/ahv-remote-console.icns
