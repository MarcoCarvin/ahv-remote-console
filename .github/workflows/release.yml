name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  runtime:
    name: runtime (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          # RELE-04: the Makefile reads AHV_REMOTE_CONSOLE_* (the plain VERSION
          # env var it set previously was ignored, so tagged binaries still
          # reported Version=dev). github.ref_name is the tag (e.g. v1.2.3).
          AHV_REMOTE_CONSOLE_VERSION: ${{ github.ref_name }}
          AHV_REMOTE_CONSOLE_COMMIT: ${{ github.sha }}
        run: |
          export AHV_REMOTE_CONSOLE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make -C apps/runtime build
          make -C plugins/ahv build
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            apps/runtime/bin/*
            plugins/ahv/bin/*

  desktop:
    name: desktop (${{ matrix.os }})
    needs: [runtime]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            runtime-artifact: runtime-linux-amd64
          - os: windows-2022
            runtime-artifact: runtime-windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.runtime-artifact }}
          path: build/runtime/
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @ahv-remote-console/desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/**/*.exe
            apps/desktop/release/**/*.msi
            apps/desktop/release/**/*.AppImage
            apps/desktop/release/**/*.deb
            apps/desktop/release/**/*.rpm
            apps/desktop/release/latest*.yml

  publish:
    name: publish release
    needs: [desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      # RELE-07: use the matching CHANGELOG.md section as the release-notes body.
      # Falls back to the [Unreleased] section if the tag has no dedicated
      # heading yet. generate_release_notes below appends the auto commit list.
      - name: Extract changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Print the body of one "## [<heading>]" section (up to the next one).
          section() {
            awk -v want="$1" '
              /^## \[/ { if (inSection) exit; if (index($0, "[" want "]")) { inSection=1; print; next } }
              inSection { print }
            ' CHANGELOG.md
          }
          # Prefer the section for this exact version; fall back to [Unreleased].
          section "$ver" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then section "Unreleased" > RELEASE_NOTES.md; fi
          if [ ! -s RELEASE_NOTES.md ]; then echo "See CHANGELOG.md." > RELEASE_NOTES.md; fi
          echo "----- release notes body -----"; cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/desktop-ubuntu-22.04/**/*
            dist/desktop-windows-2022/**/*
