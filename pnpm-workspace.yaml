packages:
  - 'apps/desktop'
  - 'packages/*'

# pnpm 10+ moved many settings out of .npmrc and the package.json#pnpm field.
# These belong in the workspace file now.
nodeLinker: isolated
strictPeerDependencies: false
autoInstallPeers: true
preferWorkspacePackages: true

peerDependencyRules:
  ignoreMissing:
    - '@types/react'
    - '@types/react-dom'

# Security override: electron-updater resolves a js-yaml 4.x release with known
# advisories about CPU use on crafted YAML. Force 4.3.2 or later, which is
# API-compatible with 4.1.x. Scoped so a js-yaml 3.x used elsewhere is untouched.
overrides:
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'

# Run package scripts through pnpm's cross-platform shell, so scripts such as
# `NODE_ENV=production vite build` also work on Windows, where pnpm would
# otherwise use cmd.exe.
shellEmulator: true

# pnpm 11 quarantines very-recent releases by default ("minimum release age").
# We explicitly opt these packages in because we have pinned the latest May 2026
# versions intentionally.
minimumReleaseAgeExclude:
  - '@types/node@25.9.1'
  - '@types/react@19.2.15'
  - electron@42.2.0

# Build scripts to allow. pnpm 11 sandboxes them by default; this list opts in
# only the ones our packaging pipeline genuinely needs.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  '@parcel/watcher': true
  husky: true
  sharp: true
